<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Haasewald</title>
<meta name="description" content="Map of the Haasewald land: parcels, contours, land trails and family locations.">
<meta name="theme-color" content="#24402B">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Haasewald">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/favicon.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="vendor/leaflet/leaflet.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="bar">
  <img src="icons/favicon.png" alt="" class="bar-logo">
  <span class="bar-title">HAASEWALD</span>
  <span class="bar-space"></span>
  <button class="bar-btn" id="btn-weather" aria-label="Hunting and weather" title="Hunting and weather">
    <svg viewBox="0 0 24 24"><path d="M8 2.5h1.5v2.2H8zM2.6 7.9h2.2v1.5H2.6zM3.9 4.6l1.06-1.06 1.56 1.56-1.06 1.06zM11.04 5.1l1.56-1.56 1.06 1.06-1.56 1.56zM8.75 6.2c-1.9 0-3.45 1.55-3.45 3.45 0 .75.24 1.44.65 2 .6-.95 1.55-1.65 2.68-1.9.5-1.15 1.4-2.07 2.53-2.6-.62-.6-1.47-.95-2.41-.95z"/><path d="M18.5 13.1c-.45-2.3-2.47-4.05-4.9-4.05-1.93 0-3.6 1.1-4.43 2.7-2 .22-3.57 1.92-3.57 3.98 0 2.21 1.79 4 4 4h8.7c1.84 0 3.33-1.49 3.33-3.33 0-1.76-1.37-3.19-3.13-3.3z"/></svg>
  </button>
  <button class="bar-btn" id="btn-layers" aria-label="Map layers" title="Map layers">
    <svg viewBox="0 0 24 24"><path d="M12 3 2 8.5l10 5.5 10-5.5L12 3Zm-7.6 9.3L2 13.6 12 19l10-5.4-2.4-1.3L12 16.4l-7.6-4.1Z"/></svg>
  </button>
  <button class="bar-btn" id="btn-family" aria-label="Family" title="Family">
    <svg viewBox="0 0 24 24"><path d="M16 11a3 3 0 1 0 0-6 3 3 0 0 0 0 6Zm-8 0a3 3 0 1 0 0-6 3 3 0 0 0 0 6Zm0 2c-2.7 0-8 1.3-8 4v2h16v-2c0-2.7-5.3-4-8-4Zm8 0c-.3 0-.7 0-1.1.1 1.3.9 2.1 2.1 2.1 3.9v2h7v-2c0-2.7-5.3-4-8-4Z"/></svg>
  </button>
  <button class="bar-btn" id="btn-menu" aria-label="More" title="More">
    <svg viewBox="0 0 24 24"><path d="M12 8a2 2 0 1 0 0-4 2 2 0 0 0 0 4Zm0 2a2 2 0 1 0 0 4 2 2 0 0 0 0-4Zm0 6a2 2 0 1 0 0 4 2 2 0 0 0 0-4Z"/></svg>
  </button>
</header>

<div id="map" aria-label="Map"></div>

<div id="wind" class="wind" hidden aria-hidden="true"></div>
<button id="wind-legend" class="wind-legend" hidden><b></b><span>Tap for the forecast</span></button>

<div id="banner" class="banner" hidden></div>

<button id="btn-locate" class="fab" aria-label="Show my location" title="Show my location">
  <svg viewBox="0 0 24 24"><path d="M12 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8Zm9 3h-2.1A7 7 0 0 0 13 5.1V3h-2v2.1A7 7 0 0 0 5.1 11H3v2h2.1a7 7 0 0 0 5.9 5.9V21h2v-2.1a7 7 0 0 0 5.9-5.9H21v-2Zm-9 6a5 5 0 1 1 0-10 5 5 0 0 1 0 10Z"/></svg>
</button>

<section id="status" class="status" aria-live="polite">
  <button class="status-head" id="status-toggle" aria-expanded="true">
    <span id="status-title">Waiting for GPS</span>
    <span class="status-chevron" aria-hidden="true"></span>
  </button>
  <div id="status-body" class="status-body"></div>
</section>

<section id="sheet" class="sheet" hidden>
  <button class="sheet-close" id="sheet-close" aria-label="Close">×</button>
  <div id="sheet-body"></div>
</section>

<div id="toast" class="toast" hidden></div>

<dialog id="dlg" class="dlg">
  <form method="dialog" class="dlg-inner">
    <h2 id="dlg-title"></h2>
    <div id="dlg-body"></div>
    <div class="dlg-actions" id="dlg-actions"><button value="close" class="btn">Close</button></div>
  </form>
</dialog>

<script src="vendor/leaflet/leaflet.js"></script>
<script src="glyphs.js"></script>
<script src="app.js"></script>
</body>
</html>
